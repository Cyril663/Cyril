<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟人脸识别系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #161b26;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 440px;
        }
        .title {
            text-align: center;
            font-size: 24px;
            margin-bottom:24px;
            color:#409eff;
        }
        .camera-wrap {
            position: relative;
            width:100%;
            height:480px;
            background:#000;
            border-radius:12px;
            overflow:hidden;
            border:2px solid #2b3544;
        }
        video {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        /* 人脸框模拟 */
        .face-box{
            position:absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            width:200px;
            height:240px;
            border:2px solid #27da69;
            border-radius:12px;
            box-shadow: 0 0 0 2px rgba(39,218,105,0.4);
            display:none;
        }
        .face-box::before{
            content:"请将人脸对准框内";
            position:absolute;
            top:-30px;
            width:100%;
            text-align:center;
            color:#27da69;
        }
        .corner{
            position:absolute;
            width:24px;
            height:24px;
            border-color:#27da69;
            border-style:solid;
        }
        .c-tl{top:-2px;left:-2px;border-width:3px 0 0 3px;}
        .c-tr{top:-2px;right:-2px;border-width:3px 3px 0 0;}
        .c-bl{bottom:-2px;left:-2px;border-width:0 0 3px 3px;}
        .c-br{bottom:-2px;right:-2px;border-width:0 3px 3px 0;}

        .status-text{
            text-align:center;
            margin-top:16px;
            font-size:16px;
        }
        .progress-bar{
            width:100%;
            height:6px;
            background:#2b3544;
            border-radius:3px;
            margin-top:12px;
            overflow:hidden;
            display:none;
        }
        .progress-inner{
            height:100%;
            width:0%;
            background:#27da69;
            transition: width 0.15s linear;
        }
        .btn-group{
            margin-top:24px;
            display:flex;
            gap:12px;
        }
        button{
            flex:1;
            height:44px;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }
        #startBtn{
            background:#409eff;
            color:#fff;
        }
        #resetBtn{
            background:#333b48;
            color:#fff;
        }
        /*弹窗*/
        .mask{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.7);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:99;
        }
        .modal{
            width:320px;
            background:#fff;
            color:#333;
            border-radius:12px;
            padding:32px 24px;
            text-align:center;
        }
        .modal h3{
            margin-bottom:12px;
        }
        .success{color:#00b42a;}
        .fail{color:#f53f3f;}
        .modal button{
            margin-top:20px;
            width:120px;
            background:#409eff;
            color:white;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="title">人脸识别核验</h2>
    <div class="camera-wrap">
        <video id="video" autoplay muted playsinline></video>
        <div class="face-box" id="faceBox">
            <div class="corner c-tl"></div>
            <div class="corner c-tr"></div>
            <div class="corner c-bl"></div>
            <div class="corner c-br"></div>
        </div>
    </div>
    <div class="status-text" id="status">点击开始，开启摄像头</div>
    <div class="progress-bar" id="progressWrap">
        <div class="progress-inner" id="progressInner"></div>
    </div>
    <div class="btn-group">
        <button id="startBtn">开始识别</button>
        <button id="resetBtn">重置</button>
    </div>
</div>

<!--结果弹窗-->
<div class="mask" id="mask">
    <div class="modal">
        <h3 id="modalTitle"></h3>
        <p id="modalDesc"></p>
        <button id="closeModal">确定</button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const faceBox = document.getElementById('faceBox');
    const statusDom = document.getElementById('status');
    const progressWrap = document.getElementById('progressWrap');
    const progressInner = document.getElementById('progressInner');
    const mask = document.getElementById('mask');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const closeModal = document.getElementById('closeModal');

    let mediaStream = null;

    // 开启摄像头
    async function openCamera(){
        try{
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video:{facingMode:"user"}
            });
            video.srcObject = mediaStream;
        }catch(err){
            statusDom.innerText = "摄像头开启失败，请授权权限";
        }
    }

    //关闭摄像头
    function closeCamera(){
        if(mediaStream){
            mediaStream.getTracks().forEach(track=>track.stop());
            mediaStream=null;
            video.srcObject=null;
        }
    }

    //模拟识别流程
    function startRecognize(){
        faceBox.style.display = "block";
        statusDom.innerText = "检测人脸中...";
        progressWrap.style.display = "block";
        progressInner.style.width = "0%";

        let p = 0;
        const timer = setInterval(()=>{
            p += Math.random()*4;
            if(p>100)p=100;
            progressInner.style.width = p+"%";
            if(p===100){
                clearInterval(timer);
                //模拟随机成功失败
                const isOk = Math.random()>0.25;
                setTimeout(()=>{
                    showModal(isOk);
                },400);
            }
        },80);
    }

    function showModal(success){
        mask.style.display="flex";
        if(success){
            modalTitle.innerText="✅识别成功";
            modalTitle.className="success";
            modalDesc.innerText="人脸比对通过，核验完成";
        }else{
            modalTitle.innerText="❌识别失败";
            modalTitle.className="fail";
            modalDesc.innerText="人脸比对不通过，请正对镜头重试";
        }
    }

    function resetAll(){
        closeCamera();
        faceBox.style.display="none";
        progressWrap.style.display="none";
        progressInner.style.width="0%";
        statusDom.innerText="点击开始，开启摄像头";
        mask.style.display="none";
    }

    startBtn.addEventListener('click',async ()=>{
        if(!mediaStream){
            await openCamera();
        }
        setTimeout(()=>{
            startRecognize();
        },600);
    });

    resetBtn.addEventListener('click',resetAll);
    closeModal.addEventListener('click',()=>{
        mask.style.display="none";
    });

    //页面销毁关闭摄像头
    window.addEventListener('beforeunload',closeCamera);
</script>
</body>
</html>
